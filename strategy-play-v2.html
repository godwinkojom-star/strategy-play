<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Strategy Play — V2</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#050705;--panel:#0b0f0b;--panel2:#101510;--line:#202820;--green:#9cff38;--text:#f3f7f1;--muted:#8b9789;--danger:#ff6575}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}button,input,select,textarea{font:inherit}button{background:#151b15;color:var(--text);border:1px solid #293329;border-radius:8px;padding:8px 10px;cursor:pointer}button:hover{border-color:#557055}button.active{background:#20351c;border-color:var(--green);color:var(--green)}.app{height:100%;display:flex;flex-direction:column}.top{height:56px;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:#070907}.brand{font-weight:800;letter-spacing:.5px;color:var(--green);margin-right:8px}.top select,.top button{height:38px}.grow{flex:1}.layout{min-height:0;flex:1;display:flex}.side{width:300px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px}.section{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:10px;margin-bottom:10px}.section h3{font-size:12px;text-transform:uppercase;color:var(--muted);margin:0 0 9px}.row{display:flex;gap:6px;flex-wrap:wrap}.row>*{flex:1}.field{width:100%;background:#070a07;color:var(--text);border:1px solid #273027;border-radius:7px;padding:9px;outline:none}.search{margin-bottom:7px}.indicator-list{max-height:220px;overflow:auto}.ind{display:flex;justify-content:space-between;align-items:center;padding:8px;border-radius:7px}.ind:hover{background:#151b15}.ind small{color:var(--muted)}.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.chip{border:1px solid #334233;border-radius:20px;padding:4px 7px;color:var(--green);font-size:11px}.chartWrap{min-width:0;flex:1;position:relative;background:#030403}.chart{position:absolute;inset:0;z-index:1}.chartWrap canvas#overlay{position:absolute;inset:0;width:100%;height:100%;z-index:4;display:block;touch-action:none}.draw{position:absolute;top:10px;left:10px;display:flex;gap:5px;flex-wrap:wrap;z-index:5;max-width:calc(100% - 20px)}.draw button{padding:6px 8px;font-size:12px;background:#0b0f0bde}.draw button.active{box-shadow:0 0 0 1px #9cff3855}.replay{position:absolute;left:12px;right:12px;bottom:12px;z-index:6;background:#0a0d0ae8;border:1px solid var(--line);backdrop-filter:blur(8px);border-radius:12px;padding:9px}.replayLine{display:flex;align-items:center;gap:8px}.replayLine input[type=range]{flex:1}.status{color:var(--muted);font-size:11px;min-width:75px;text-align:right}.mobileMenu{display:none}.hint{font-size:11px;color:var(--muted);line-height:1.45}.tradegrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tradegrid .full{grid-column:1/-1}.stat{display:flex;justify-content:space-between;color:var(--muted);padding:3px 0}.stat b{color:var(--text)}@media(max-width:800px){.side{position:absolute;z-index:20;left:-310px;top:56px;bottom:0;transition:.2s;width:300px;box-shadow:8px 0 30px #000}.side.open{left:0}.mobileMenu{display:block}.brand{margin-right:auto}.top .desktop{display:none}.draw{top:8px}.draw button{font-size:11px;padding:6px}.replay{bottom:8px;left:8px;right:8px}}
</style>
</head>
<body><div class="app">
<header class="top"><button class="mobileMenu" id="menu">☰</button><div class="brand">STRATEGY PLAY</div><select id="symbol"><option value="BTCUSDT">BTC / USDT</option><option value="ETHUSDT">ETH / USDT</option><option value="SOLUSDT">SOL / USDT</option><option value="XAUUSD">XAU / USD</option><option value="EURUSD">EUR / USD</option><option value="GBPUSD">GBP / USD</option><option value="USDJPY">USD / JPY</option><option value="GBPJPY">GBP / JPY</option></select><select id="tf"><option value="1h">1H</option><option value="15m">15M</option><option value="4h">4H</option><option value="1d">1D</option></select><button id="save" class="desktop">Save</button><button id="reset" class="desktop">Reset</button><div class="grow"></div><span id="saveState" class="status">Ready</span></header>
<div class="layout">
<aside class="side" id="side">
<div class="section"><h3>Indicators</h3><input id="indSearch" class="field search" placeholder="Search indicators… e.g. SMC, EMA, RSI"><div id="indList" class="indicator-list"></div><div id="activeInd" class="chips"></div><p class="hint">Search the built-in Strategy Play library. SMC tools are implemented locally; arbitrary TradingView community scripts are not imported automatically.</p></div>
<div class="section"><h3>Replay</h3><div class="row"><button id="play">▶ Play</button><button id="pause">Ⅱ Pause</button><button id="next">Next candle</button></div><div class="row" style="margin-top:6px"><select id="speed"><option value="1000">1×</option><option value="500">2×</option><option value="250">4×</option><option value="100">10×</option></select><button id="resetReplay">Reset replay</button></div></div>
<div class="section"><h3>Manual trade</h3><div class="tradegrid"><input id="entry" class="field" placeholder="Entry"><input id="sl" class="field" placeholder="Stop loss"><input id="tp" class="field" placeholder="Take profit"><select id="sideTrade" class="field"><option>Long</option><option>Short</option></select><input id="note" class="field full" placeholder="Trade note"><button id="addTrade" class="full">Record trade</button></div></div>
<div class="section"><h3>Workspace</h3><div class="stat"><span>Drawings</span><b id="drawCount">0</b></div><div class="stat"><span>Trades</span><b id="tradeCount">0</b></div><div class="stat"><span>Visible candles</span><b id="candleCount">0</b></div><button id="clearDraw" style="width:100%;margin-top:7px">Clear drawings</button></div>
</aside>
<main class="chartWrap"><div id="chart" class="chart"></div><canvas id="overlay"></canvas>
<div class="draw"><button data-tool="select" class="active">↖ Select</button><button data-tool="trend">╱ Trend</button><button data-tool="hline">— H-Line</button><button data-tool="vline">│ V-Line</button><button data-tool="rect">▣ Zone</button><button data-tool="fib">FIB</button><button data-tool="text">T Text</button><button data-tool="delete">⌫ Delete</button></div>
<div class="replay"><div class="replayLine"><button id="prev">‹ Prev</button><button id="playChart">▶ Play</button><button id="pauseChart">Ⅱ Pause</button><button id="next2">Next ›</button><input id="range" type="range" min="20" max="1000" value="1000"><span id="replayText" class="status">100%</span></div></div>
</main></div></div>
<script>
const $=id=>document.getElementById(id), KEY='strategy_play_v2_workspace';
const LIB=[
 ['EMA','Exponential Moving Average','trend'],['SMA','Simple Moving Average','trend'],['VWAP','Volume Weighted Average Price','volume'],['RSI','Relative Strength Index','momentum'],['MACD','MACD','momentum'],['Bollinger Bands','Bollinger Bands','volatility'],['ATR','Average True Range','volatility'],['Stochastic','Stochastic Oscillator','momentum'],['SMC Analysis Toolkit','Smart Money Concepts / SMC analysis','smc'],['SMC Market Structure','BOS / CHOCH swing structure','smc'],['SMC Order Blocks','Order-block zones','smc'],['SMC Fair Value Gaps','FVG zones','smc'],['SMC Liquidity','Equal highs / lows','smc']
];
let chart, candleSeries, candles=[], visible=0, timer=null, activeTool='select', drawing=null, drawings=[], trades=[], indicators=[], generated=[], preview=null;
let overlays=[];
function loadState(){try{let s=JSON.parse(localStorage.getItem(KEY)||'{}');drawings=s.drawings||[];trades=s.trades||[];indicators=s.indicators||[];}catch(e){}}
function saveState(){localStorage.setItem(KEY,JSON.stringify({drawings,trades,indicators,symbol:$('symbol').value,tf:$('tf').value}));$('saveState').textContent='Saved';setTimeout(()=>$('saveState').textContent='Ready',900);updateStats()}
async function fetchData(){
 $('saveState').textContent='Loading…'; const tf=$('tf').value; const sym=$('symbol').value;
 if(!['BTCUSDT','ETHUSDT','SOLUSDT'].includes(sym)){ candles=[]; visible=0; candleSeries.setData([]); clearGenerated(); drawOverlay(); $('saveState').textContent='Pair listed — data adapter needed'; updateStats(); return; }
 const url=`https://api.binance.com/api/v3/klines?symbol=${sym}&interval=${tf}&limit=1000`;
 try{let r=await fetch(url);let a=await r.json();candles=a.map(x=>({time:Math.floor(x[0]/1000),open:+x[1],high:+x[2],low:+x[3],close:+x[4],volume:+x[5]}));visible=candles.length;$('range').max=candles.length;$('range').value=visible;render();$('saveState').textContent='Live data';}catch(e){$('saveState').textContent='Data error';}}
function init(){loadState();chart=LightweightCharts.createChart($('chart'),{layout:{background:{type:'solid',color:'#030403'},textColor:'#dfe8dc'},grid:{vertLines:{color:'#141a14'},horzLines:{color:'#141a14'}},crosshair:{mode:LightweightCharts.CrosshairMode.Normal},rightPriceScale:{borderColor:'#202820'},timeScale:{borderColor:'#202820',timeVisible:true,secondsVisible:false}});candleSeries=chart.addCandlestickSeries({upColor:'#9cff38',downColor:'#ef5665',borderVisible:false,wickUpColor:'#9cff38',wickDownColor:'#ef5665'});window.addEventListener('resize',resize);resize();drawLibrary();fetchData();renderActive();updateStats();}
function resize(){let r=$('chart').getBoundingClientRect();chart.applyOptions({width:r.width,height:r.height});$('overlay').width=Math.max(1,Math.floor(r.width*devicePixelRatio));$('overlay').height=Math.max(1,Math.floor(r.height*devicePixelRatio));$('overlay').style.width=r.width+'px';$('overlay').style.height=r.height+'px';drawOverlay()}
function render(){if(!candles.length)return;let n=Math.max(20,Math.min(candles.length,Math.round(candles.length*(+$('range').value/100))));visible=n;candleSeries.setData(candles.slice(0,n));applyIndicators();drawOverlay();$('replayText').textContent=Math.round(n/candles.length*100)+'%';$('range').max=candles.length;$('range').value=n;updateStats();}
function clearGenerated(){overlays.forEach(o=>{try{chart.removeSeries(o)}catch(e){}});overlays=[];generated=[]}
function lineSeries(data,opts){let s=chart.addLineSeries(opts);s.setData(data);overlays.push(s);return s}
function sma(vals,p){let out=[];for(let i=0;i<vals.length;i++){if(i<p-1)continue;let z=0;for(let j=i-p+1;j<=i;j++)z+=vals[j];out.push({time:candles[i].time,value:z/p})}return out}
function ema(vals,p){let out=[],k=2/(p+1),e=vals[0];for(let i=0;i<vals.length;i++){e=i?vals[i]*k+e*(1-k):vals[i];if(i>=p-1)out.push({time:candles[i].time,value:e})}return out}
function applyIndicators(){clearGenerated();let vis=candles.slice(0,visible), close=vis.map(x=>x.close);for(const name of indicators){if(name==='EMA')lineSeries(ema(close,20),{color:'#9cff38',lineWidth:2});if(name==='SMA')lineSeries(sma(close,20),{color:'#fff',lineWidth:1});if(name==='VWAP'){let cumPV=0,cumV=0;lineSeries(vis.map(x=>{cumPV+=((x.high+x.low+x.close)/3)*x.volume;cumV+=x.volume;return{time:x.time,value:cumPV/cumV}}),{color:'#61d8ff',lineWidth:2});}if(name==='SMC Market Structure')makeStructure(vis);if(name==='SMC Fair Value Gaps')makeFVG(vis);if(name==='SMC Liquidity')makeLiquidity(vis);if(name==='SMC Order Blocks')makeOB(vis);}}
function makeStructure(a){let pts=[];for(let i=2;i<a.length-2;i++){if(a[i].high>a[i-1].high&&a[i].high>a[i+1].high)pts.push({i,type:'H',p:a[i].high});if(a[i].low<a[i-1].low&&a[i].low<a[i+1].low)pts.push({i,type:'L',p:a[i].low});}generated.push(...pts)}
function makeFVG(a){for(let i=2;i<a.length;i++){if(a[i].low>a[i-2].high)generated.push({kind:'fvg',a:a[i-2].time,b:a[i].time,top:a[i].low,bottom:a[i-2].high});if(a[i].high<a[i-2].low)generated.push({kind:'fvg',a:a[i-2].time,b:a[i].time,top:a[i-2].low,bottom:a[i].high});}}
function makeLiquidity(a){for(let i=2;i<a.length;i++){if(Math.abs(a[i].high-a[i-1].high)/a[i].high<.0015)generated.push({kind:'liq',time:a[i].time,p:(a[i].high+a[i-1].high)/2});if(Math.abs(a[i].low-a[i-1].low)/a[i].low<.0015)generated.push({kind:'liq',time:a[i].time,p:(a[i].low+a[i-1].low)/2});}}
function makeOB(a){for(let i=1;i<a.length-2;i++){let c=a[i],n=a[i+1];if(c.close<c.open&&n.close>n.open&&n.close>c.high)generated.push({kind:'ob',a:c.time,b:n.time,top:c.high,bottom:c.low});if(c.close>c.open&&n.close<n.open&&n.close<c.low)generated.push({kind:'ob',a:c.time,b:n.time,top:c.high,bottom:c.low});}}
function drawLibrary(){let q=()=>{let term=$('indSearch').value.toLowerCase();$('indList').innerHTML='';LIB.filter(x=>(x[0]+' '+x[1]+' '+x[2]).toLowerCase().includes(term)).forEach(x=>{let d=document.createElement('div');d.className='ind';d.innerHTML=`<span><b>${x[0]}</b><br><small>${x[1]}</small></span><button>${indicators.includes(x[0])?'Remove':'Add'}</button>`;d.querySelector('button').onclick=()=>toggleIndicator(x[0]);$('indList').appendChild(d)})};q();$('indSearch').oninput=q}
function toggleIndicator(n){indicators=indicators.includes(n)?indicators.filter(x=>x!==n):[...indicators,n];renderActive();render();saveState();drawLibrary()}
function renderActive(){$('activeInd').innerHTML=indicators.map(x=>`<span class="chip">${x}</span>`).join('')}
function updateStats(){$('drawCount').textContent=drawings.length;$('tradeCount').textContent=trades.length;$('candleCount').textContent=visible}
function xyFromEvent(e){let r=$('overlay').getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function anchor(x,y){let t=chart.timeScale().coordinateToTime(x),p=candleSeries.coordinateToPrice(y);return t&&p!=null?{time:typeof t==='object'?Math.floor(Date.parse(t.year+'-'+t.month+'-'+t.day)/1000):t,price:p}:null}
function drawOverlay(){
 let c=$('overlay'),ctx=c.getContext('2d'),w=c.clientWidth,h=c.clientHeight;
 if(!w||!h)return;
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.clearRect(0,0,w,h);
 const X=t=>chart.timeScale().timeToCoordinate(t),Y=p=>candleSeries.priceToCoordinate(p);
 generated.forEach(g=>{
  if(g.kind==='fvg'||g.kind==='ob'){let x1=X(g.a),x2=X(g.b)||w;if(x1==null)return;let y1=Y(g.top),y2=Y(g.bottom);if(y1!=null&&y2!=null){ctx.fillStyle=g.kind==='fvg'?'rgba(156,255,56,.08)':'rgba(255,170,40,.08)';ctx.strokeStyle=g.kind==='fvg'?'rgba(156,255,56,.55)':'rgba(255,170,40,.55)';ctx.fillRect(x1,Math.min(y1,y2),x2-x1,Math.abs(y2-y1));ctx.strokeRect(x1,Math.min(y1,y2),x2-x1,Math.abs(y2-y1));}}
  if(g.kind==='liq'){let x=X(g.time),y=Y(g.p);if(x!=null&&y!=null){ctx.setLineDash([4,4]);ctx.strokeStyle='#61d8ff99';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(w,y);ctx.stroke();ctx.setLineDash([])}}
  if(g.type){let x=X(candles[g.i]?.time),y=Y(g.p);if(x!=null&&y!=null){ctx.fillStyle='#fff';ctx.font='10px system-ui';ctx.fillText(g.type==='H'?'SH':'SL',x+3,y+(g.type==='H'?-5:12));}}
 });
 if(preview) renderDrawings([preview]);
 renderDrawings(drawings);
 function renderDrawings(list){list.forEach(d=>{
  let a=d.a,b=d.b||d.a,x1=X(a.time),y1=Y(a.price),x2=X(b.time),y2=Y(b.price);if(x1==null||y1==null)return;
  ctx.strokeStyle=d.color||'#9cff38';ctx.fillStyle=(d.color||'#9cff38')+'22';ctx.lineWidth=1.5;ctx.setLineDash([]);
  if(d.kind==='hline'){ctx.beginPath();ctx.moveTo(0,y1);ctx.lineTo(w,y1);ctx.stroke()}
  else if(d.kind==='vline'){ctx.beginPath();ctx.moveTo(x1,0);ctx.lineTo(x1,h);ctx.stroke()}
  else if(d.kind==='trend'){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2??x1,y2??y1);ctx.stroke()}
  else if(d.kind==='rect'){let xx=x2??x1,yy=y2??y1;ctx.fillRect(Math.min(x1,xx),Math.min(y1,yy),Math.abs(xx-x1),Math.abs(yy-y1));ctx.strokeRect(Math.min(x1,xx),Math.min(y1,yy),Math.abs(xx-x1),Math.abs(yy-y1))}
  else if(d.kind==='fib'){let yy=y2??y1,xx=x2??x1;ctx.strokeStyle='#ffffff66';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(xx,yy);ctx.stroke();[0,.236,.382,.5,.618,.786,1].forEach(f=>{let y=y1+(yy-y1)*f;ctx.strokeStyle='#9cff3866';ctx.beginPath();ctx.moveTo(Math.min(x1,xx),y);ctx.lineTo(Math.max(x1,xx),y);ctx.stroke()})}
  else if(d.kind==='text'){ctx.fillStyle=d.color||'#9cff38';ctx.font='12px system-ui';ctx.fillText(d.text||'Note',x1,y1)}
 });}
}
function nearestDrawing(a){let best=-1,bd=Infinity;for(let i=0;i<drawings.length;i++){let d=drawings[i],dt=Math.abs((d.a.time||0)-(a.time||0)),dp=Math.abs((d.a.price||0)-(a.price||0));let score=dt/3600+dp/Math.max(a.price||1,1)*100;if(score<bd){bd=score;best=i}}return bd<12?best:-1}
function setTool(t){activeTool=t;drawing=null;preview=null;document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));$('overlay').style.pointerEvents=t==='select'?'none':'auto';drawOverlay()}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));
$('overlay').addEventListener('pointerdown',e=>{
 if(activeTool==='select')return;
 e.preventDefault();let p=xyFromEvent(e),a=anchor(p.x,p.y);if(!a)return;
 if(activeTool==='delete'){let i=nearestDrawing(a);if(i>=0){drawings.splice(i,1);saveState();drawOverlay()}return}
 if(activeTool==='hline'||activeTool==='vline'||activeTool==='text'){
  let text=activeTool==='text'?prompt('Text / note:',''):'';if(activeTool==='text'&&text===null)return;
  drawings.push({kind:activeTool,a,color:'#9cff38',text:text||''});saveState();drawOverlay();return;
 }
 drawing={kind:activeTool,a,color:'#9cff38'};preview=drawing;try{$('overlay').setPointerCapture(e.pointerId)}catch(_){ }
});
$('overlay').addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();let p=xyFromEvent(e),b=anchor(p.x,p.y);if(b){drawing.b=b;preview=drawing;drawOverlay()}});
$('overlay').addEventListener('pointerup',e=>{if(!drawing)return;e.preventDefault();let p=xyFromEvent(e),b=anchor(p.x,p.y);if(b){drawing.b=b;drawings.push({...drawing});saveState()}drawing=null;preview=null;drawOverlay();try{$('overlay').releasePointerCapture(e.pointerId)}catch(_){ }});
$('overlay').addEventListener('pointercancel',()=>{drawing=null;preview=null;drawOverlay()});

$('clearDraw').onclick=()=>{if(confirm('Clear all manual drawings?')){drawings=[];saveState();drawOverlay()}};
function startReplay(){if(!candles.length)return;clearInterval(timer);$('play').classList.add('active');$('playChart').classList.add('active');timer=setInterval(()=>{if(visible>=candles.length){clearInterval(timer);$('play').classList.remove('active');$('playChart').classList.remove('active');return}visible++;$('range').value=visible;render()},+$('speed').value)}
function stopReplay(){clearInterval(timer);$('play').classList.remove('active');$('playChart').classList.remove('active')}
$('play').onclick=startReplay;$('playChart').onclick=startReplay;$('pause').onclick=stopReplay;$('pauseChart').onclick=stopReplay;$('next').onclick=$('next2').onclick=()=>{stopReplay();if(candles.length&&visible<candles.length){visible++;$('range').value=visible;render()}};$('prev').onclick=()=>{stopReplay();if(candles.length&&visible>20){visible--;$('range').value=visible;render()}};$('resetReplay').onclick=()=>{stopReplay();$('range').max=Math.max(20,candles.length);$('range').value=candles.length;visible=candles.length;render()};$('range').oninput=()=>{stopReplay();render()};$('speed').onchange=()=>{if(timer)startReplay()};
$('addTrade').onclick=()=>{let e=+$('entry').value,s=+$('sl').value,t=+$('tp').value;if(!e||!s||!t)return alert('Enter entry, stop loss and take profit.');trades.push({side:$('sideTrade').value,entry:e,sl:s,tp:t,note:$('note').value,time:Date.now()});$('note').value='';saveState()};$('save').onclick=saveState;$('reset').onclick=()=>{if(confirm('Reset Strategy Play workspace?')){localStorage.removeItem(KEY);location.reload()}};$('menu').onclick=()=>$('side').classList.toggle('open');$('tf').onchange=fetchData;$('symbol').onchange=fetchData;
init();
</script></body></html>
