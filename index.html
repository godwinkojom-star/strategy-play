<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050807"><title>Strategy Play</title><link rel="stylesheet" href="styles.css"></head><body><div id="app"><header class="topbar"><button id="mobileMenu" class="icon-btn">☰</button><div class="brand"><span class="brand-mark">S</span><span>Strategy <b>Play</b></span></div><div class="market-controls"><select id="symbol"><option value="BTCUSDT">BTC / USDT</option><option value="ETHUSDT">ETH / USDT</option><option value="SOLUSDT">SOL / USDT</option><option value="BNBUSDT">BNB / USDT</option><option value="XRPUSDT">XRP / USDT</option></select><select id="timeframe"><option value="1m">1m</option><option value="5m">5m</option><option value="15m">15m</option><option value="1h" selected>1H</option><option value="4h">4H</option><option value="1d">1D</option></select></div><div class="top-actions"><button id="saveBtn" class="ghost-btn">Save</button><button id="resetBtn" class="ghost-btn">Reset view</button></div></header><div class="workspace"><aside id="sidebar" class="sidebar"><section><div class="section-title">Replay</div><div class="replay-controls"><button id="playBtn" class="primary-btn">▶ Play</button><button id="pauseBtn" class="ghost-btn">Ⅱ</button><button id="nextBtn" class="ghost-btn">Next</button></div><label class="range-label">Speed <span id="speedValue">1x</span></label><input id="speed" type="range" min="1" max="5" value="1"></section><section><div class="section-title">Tools</div><div class="tool-grid" id="tools"><button class="tool active" data-tool="crosshair">✛<span>Crosshair</span></button><button class="tool" data-tool="line">╱<span>Trend line</span></button><button class="tool" data-tool="horizontal">━<span>Horizontal</span></button><button class="tool" data-tool="rectangle">□<span>Zone</span></button><button class="tool" data-tool="fib">⌁<span>Fibonacci</span></button><button class="tool" data-tool="text">T<span>Text</span></button><button class="tool" data-tool="trade">↕<span>Trade</span></button><button class="tool" data-tool="eraser">⌫<span>Erase</span></button></div></section><section><div class="section-title">Manual Trade</div><div class="trade-fields"><label>Entry<input id="entry" type="number" step="any" placeholder="Price"></label><label>Stop Loss<input id="sl" type="number" step="any" placeholder="Price"></label><label>Take Profit<input id="tp" type="number" step="any" placeholder="Price"></label><label>Note<textarea id="tradeNote" rows="3" placeholder="Your analysis..."></textarea></label><button id="recordTrade" class="primary-btn">Record Trade</button></div></section><section><div class="section-title">Your Workspace</div><div class="workspace-stat"><span>Drawings</span><b id="drawingCount">0</b></div><div class="workspace-stat"><span>Trades</span><b id="tradeCount">0</b></div><div class="workspace-stat"><span>Status</span><b id="saveStatus">Saved</b></div></section></aside><main class="main"><div class="chart-head"><div><div id="pairTitle" class="pair-title">BTC / USDT</div><div id="chartStatus" class="muted">Loading historical candles…</div></div><div class="chart-actions"><button id="fitBtn" class="ghost-btn">Fit</button><button id="clearDrawings" class="ghost-btn danger">Clear drawings</button></div></div><div id="chartWrap" class="chart-wrap"><div id="chart"></div><canvas id="overlay"></canvas><div id="loading" class="loading">Loading…</div><div id="crosshairInfo" class="crosshair-info hidden"></div></div><div class="timeline"><span>Replay</span><input id="replayRange" type="range" min="0" max="1" value="1"><span id="candleCounter">0 / 0</span></div><div class="bottom-panel"><div class="bottom-title">Analysis journal</div><textarea id="journal" placeholder="Write what you saw, what you marked, and what you learned."></textarea></div></main></div></div><script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script><script src="app.js"></script></body></html>
